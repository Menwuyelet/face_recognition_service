[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-recognition-service"
version = "1.0.0"
description = "Standalone face recognition service: embedding extraction, matching, and encrypted storage."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "cryptography>=42.0",
    "insightface>=0.7",
    "numpy>=1.24",
    "onnxruntime>=1.16",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
